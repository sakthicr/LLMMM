[project]
name = "ea-poetry"
version = "0.1.0"
description = "Comparative study of GA vs NSGA-II for LLM-guided poem generation"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "nltk>=3.8",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "tabulate>=0.9",
    "g2p_en>=2.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

